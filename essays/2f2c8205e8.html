<div class="center"><h1>当你再次看到此文，反思下你是否改掉了乱写的毛病</h1></div>
<div class="gap"></div>
<p>这里所谓的乱写，是指为醋包饺子写法，从动人的地方进去，写着写着才安个主题上来。这当然不算危害社会，也不算亵渎工作——反正你好好写也吃不上这碗饭。但，这始终是被笔拉着走，而你真正想要的是以理性去驱使手中的笔啊。</p>
<p>以后，别的不说，一定要先定主题。先想好要表达什么，再围绕着来。否则就是对自己的目的不忠，就是犯错。</p>
<p>2026年10月18日</p>
