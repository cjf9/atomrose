<h1>夜行的列车</h1>
<p>这是「小说与诗」栏目的第一篇，占位用。</p>
<p>铁轨把夜色分成两半<br>
一半归灯<br>
一半归我</p>
<p>窗外是没有名字的城<br>
每一盏灯都在后退<br>
像来不及告别的人</p>
<p>—— 占位，替换成你自己的东西。</p>
<h2>说明</h2>
<p>段落里换行会变成硬换行，所以写诗可以直接一行一行写，不用管什么标记。</p>
