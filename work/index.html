    跑 update_all_index.pyw 就没了。

    想改卡片，按目的去改对应的地方：
      · 结构（有没有图、摘要多长、元素顺序）→ tools/update_work_index.py 的 render()
      · 外观（宽度、圆角、间距、hover）      → assets/style.css 里 .card 那组规则
      · 某张卡片的图或摘要                    → 改那篇文章自己的配图和 <meta name="description">

    <ul> 上的两个 class 不能删也不能改名：
      .posts  → assets/new-tag.js 靠它找列表（删了 new 标签就没了）
      .cards  → assets/style.css 靠它切卡片布局（删了就变回一行行标题）
    改了不会报错，只会静默失效，这种最难查。

    圈外的内容（上面的说明文字、页脚、导航、head）随便改，脚本一个字都不碰。
  -->
