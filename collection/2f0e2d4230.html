<div class="center"><h1>长亭怨慢 奉补赠旧友</h1></div>
<div class="gap"></div>
<p>2020年</p>
<div class="gap"></div>
<p>冻风起、小城迟暮。温暖灯火，别门他户。岁去无踪，年来多梦总卿晤。锦花延遍，金碧路、红楼浦。奈梦醒时分，依稀只、闻先生墓。</p>
<p>有负。负诚言待我，悔未缘由君诉：两伤肺腑，却也怪、面包言误。记还记、欠女长诗，晓须晓、今生无路。敬祝好余年，无复遇人如仆。</p>
<div class="gap"></div>
<p>注：刚学诗写的，金碧路红楼浦地名，闻先生闻一多。</p>
