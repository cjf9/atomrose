<div class="center"><h1>鹊桥仙 等洗澡水烧热</h1></div>
<div class="gap"></div>
<p>翠涛浮沫，仙娥吹去，洒洒洋槐花落。蓉城三月事无多，说来竟、如云似鹤。</p>
<p>如云似鹤，幼时心愿，年少不谙寂寞。而今不敢望星河，怕望见、长桥轮廓。</p>
<div class="gap"></div>
<p>注：翠涛这里是指酒啊。那天路过洋槐花树下，仰头看见白色花穗从浓阴里露出来，想要找个比喻，想来想去，没个好的。开始只想到抹茶蛋糕上挂的奶油，不好写成古体诗，说是绿豆糕挂糖霜吧，感觉味道会很怪，最后想到绿酒上面的泡沫。</p>
