<div class="center"><h1>七律 冬日过岭有感</h1></div>
<div class="gap"></div>
<p>2021年写。这首诗是写“白”的。我喜欢白色，然而大自然并不慷慨使用它，白色藏在山野间，需要一双善于发现的眼睛方能找到</p>
<div class="gap"></div>
<div class="center"><p>渝南腊月冬将去，始驾轻车过岭来。<br>
林表未期残雪覆，草间却见野棉开。<br>
崖山永向明光照，荻穗频朝赤日抬。<br>
绵亘炊烟飘宇外，琼华在意尽皑皑。</p></div>
