<div class="center"><h1>赞小城财商讲师</h1></div>
<div class="gap"></div>
<div class="center"><p>劳苦园丁不顾家，<br>
辛勤流转似飞沙。<br>
城中已少摇钱树，<br>
乡坝还多韭菜花。</p></div>
<div class="gap"></div>
<p>这个诗写于2021年3月，当时小县城里居然有人来推销“财商”课。财商，多么韭菜的词汇，当时真忍不住笑，讽刺了一下。那时候太喜欢冷嘲热讽了。那时候还不知道沈从文的教诲，或者已经读过汪先生的书知道了，但没听进去。第一次做自选集2022年没选，今天选上。因为有点感伤。今天是2026年10月18日。不过从诗的角度来讲，确实起承转合没做好，有点狗屁不通，哈哈</p>
